# VNDP local stack — system of record, knowledge graph, vectors, ingestion, event bus.
# Parity with prod; named volumes persist data (only `down -v` wipes). See docs/08_INFRASTRUCTURE_SETUP.
# Event bus = Redpanda (Kafka-compatible) per execution decision R-06.

name: vndp

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: vndp
      POSTGRES_PASSWORD: ${VNDP_DB_PASSWORD:-changeme_local}
      POSTGRES_DB: vndp
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vndp -d vndp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${VNDP_NEO4J_PASSWORD:-changeme_local}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    environment:
      N8N_PORT: 5678
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Kolkata
      N8N_RUNNERS_ENABLED: "true"
    ports: ["5678:5678"]
    volumes: ["n8n_data:/home/node/.n8n"]
    restart: unless-stopped

  # --- Event bus: Redpanda (Kafka API on 9092) ---
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --schema-registry-addr=0.0.0.0:18081
    ports: ["9092:9092", "18081:18081", "8082:8082"]
    volumes: ["redpanda_data:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:latest
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:18081
    ports: ["8080:8080"]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  neo4j_data:
  qdrant_data:
  n8n_data:
  redpanda_data:
